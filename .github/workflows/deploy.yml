name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/hopeful-goldberg-ub70dn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages no conoce las rutas de la app (/proyecto/...): sirve 404.html,
      # que es la misma app y resuelve la ruta en el navegador.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
